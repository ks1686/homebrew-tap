name: audit

# Checks the published casks: strict online audit (URLs reachable, sha256
# matches the release asset), then installs each cask and runs its binary.
# Casks are generated by GoReleaser in ks1686/genv and ks1686/peaproxy, so
# this workflow only reports problems; fixes belong in those repos.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # main 2026-10-13

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Point the ks1686/tap tap at this checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/ks1686/homebrew-tap"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust ks1686/tap || true

      - name: Audit casks (strict, online)
        run: brew audit --cask --strict --online ks1686/tap/genv ks1686/tap/peaproxy

      - name: Install casks and run the binaries
        run: |
          brew install --cask ks1686/tap/genv ks1686/tap/peaproxy
          genv --version
          peaproxy --version
          test "$(genv --version | head -n1)" = "genv $(brew info --cask --json=v2 ks1686/tap/genv | ruby -rjson -e 'puts JSON.parse(STDIN.read)["casks"][0]["version"]')"
          test "$(peaproxy --version | head -n1)" = "peaproxy $(brew info --cask --json=v2 ks1686/tap/peaproxy | ruby -rjson -e 'puts JSON.parse(STDIN.read)["casks"][0]["version"]')"
